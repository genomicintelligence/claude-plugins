name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a CLI release cannot turn CI red overnight. Bump on purpose.
  CLAUDE_CODE_VERSION: 2.1.321

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the key check reads all of history
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate marketplace and plugin (claude plugin validate)
        run: |
          npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict .
          npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict plugins/genomic-intelligence
          # The directory profile runs WITHOUT --strict on purpose: its only
          # warning today is ICON_MISSING, and no icon has been chosen yet (the
          # first icon submitted may become the permanent listing icon). Add
          # plugins/genomic-intelligence/.claude-plugin/icon.png, then add
          # --strict here and in the other workflow.
          npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --profile directory plugins/genomic-intelligence

      - name: Repo rules (manifests, MCP headers, no hooks or commands, READMEs)
        run: python3 -I scripts/check-manifests.py

      - name: Zip extractor tests (offline)
        run: python3 -I scripts/tests/test_fetch_skill.py

      - name: Skill folder matches the published zip
        run: scripts/check-skill.sh

      - name: No API keys in the tree or history
        run: scripts/check-keys.sh --history
